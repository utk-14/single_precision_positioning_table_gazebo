controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lead_screw_position_controller:
      type: position_controllers/JointGroupPositionController

    platform_position_controller:
      type: position_controllers/JointGroupPositionController

lead_screw_position_controller:
  ros__parameters:
    joints:
      - lead_screw_joint

platform_position_controller:
  ros__parameters:
    joints:
      - platform_joint
